[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bankism"
version = "1.0.0"
description = "Bankism — Blue-Team AI Firewall & Guardrail Defense"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PromptWars Team", email = "security@bankism.local" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "S"]
ignore = [
    "S101", # Allow assert in pytest test files
    "S104", # Allow 0.0.0.0 bind in dev configurations if controlled
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101", "E402", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "security: marks tests as security boundary and injection tests",
    "adversarial: marks tests as adversarial evasion tests",
    "boundary: marks tests as transaction boundary tests",
    "property: marks tests as property-based fuzz tests"
]
